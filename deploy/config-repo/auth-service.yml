# ============================================================================
# Configuración de auth-service para el entorno DOCKER.
# Igual que bank-config-repo/auth-service.yml pero con los hostnames de la red
# de docker-compose (mongodb, discovery-server) en lugar de localhost.
# ============================================================================
server:
  port: 8084

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/auth_db

# Autenticación / autorización con JWT (Parte III).
app:
  jwt:
    secret: "bank-system-super-secret-key-for-jwt-hs256-2026-nttdata"
    issuer: "bank-system"
    expiration-seconds: 3600
  default-user:
    username: admin
    password: admin123
    role: ADMIN

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
