# ============================================================================
# Configuración de credit-service para el entorno DOCKER.
# Igual que bank-config-repo/credit-service.yml pero con los hostnames de la
# red de docker-compose (mongodb, kafka, customer-service, discovery-server)
# en lugar de localhost.
# ============================================================================
server:
  port: 8083

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/credit_db
  # Kafka (Parte III) — arquitectura orientada a eventos
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  urls:
    customer-service: "http://customer-service:8081/customers/"
  # Parte III: arquitectura orientada a eventos con Kafka.
  kafka:
    topics:
      credit-movements: credit-movements
  jwt:
    secret: "bank-system-super-secret-key-for-jwt-hs256-2026-nttdata"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Estándar de resiliencia (circuit breakers) — bank-resilience-commons
resilience4j:
  circuitbreaker:
    instances:
      customerServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      customerServiceCB:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
